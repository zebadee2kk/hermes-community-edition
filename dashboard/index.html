<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hermes Community Edition</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #e2e8f0; --muted: #94a3b8; --accent: #3b82f6; --green: #22c55e; --amber: #f59e0b; --red: #ef4444; }
    * { box-sizing: border-box; margin: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header { padding: 24px 32px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.25rem; }
    header .version { color: var(--muted); font-size: 0.85rem; }
    main { padding: 32px; max-width: 1200px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 32px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
    .card h3 { font-size: 0.9rem; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .card .value { font-size: 1.8rem; font-weight: 600; }
    .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
    .status-dot.green { background: var(--green); }
    .status-dot.amber { background: var(--amber); }
    .status-dot.red { background: var(--red); }
    .status-dot.grey { background: var(--muted); }
    .services { margin-top: 24px; }
    .services h2 { font-size: 1.1rem; margin-bottom: 16px; }
    .service-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
    .service-name { font-weight: 500; }
    .service-status { font-size: 0.85rem; color: var(--muted); }
    .refresh { color: var(--muted); font-size: 0.8rem; text-align: right; margin-top: 16px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>🤖 Hermes Community Edition</h1>
      <span class="version">v1.0.0 — Self-hosted AI agent platform</span>
    </div>
    <div id="overall-status"><span class="status-dot grey"></span>Checking...</div>
  </header>
  <main>
    <div class="grid">
      <div class="card">
        <h3>Gateway</h3>
        <div class="value" id="gateway-status">—</div>
      </div>
      <div class="card">
        <h3>Model Provider</h3>
        <div class="value" id="model-provider">Ollama</div>
      </div>
      <div class="card">
        <h3>Active Skills</h3>
        <div class="value" id="skill-count">—</div>
      </div>
      <div class="card">
        <h3>Uptime</h3>
        <div class="value" id="uptime">—</div>
      </div>
    </div>

    <div class="services">
      <h2>Services</h2>
      <div id="services-list">
        <div class="service-row">
          <span class="service-name">Gateway</span>
          <span class="service-status" id="svc-gateway">Checking...</span>
        </div>
        <div class="service-row">
          <span class="service-name">Dashboard</span>
          <span class="service-status" id="svc-dashboard">Checking...</span>
        </div>
        <div class="service-row">
          <span class="service-name">Database</span>
          <span class="service-status" id="svc-db">Checking...</span>
        </div>
      </div>
    </div>
    <p class="refresh" id="refresh-meta">Refreshing every 10s...</p>
  </main>

  <script>
    const GATEWAY_URL = window.location.origin.replace(/:\d+$/, '') + ':8080';

    async function checkHealth() {
      try {
        const r = await fetch(GATEWAY_URL + '/health', { signal: AbortSignal.timeout(5000) });
        const data = await r.json();
        document.getElementById('gateway-status').textContent = 'Healthy';
        document.getElementById('overall-status').innerHTML = '<span class="status-dot green"></span>All systems operational';
        document.getElementById('svc-gateway').innerHTML = '<span class="status-dot green"></span>Running';
        if (data.model_provider) document.getElementById('model-provider').textContent = data.model_provider;
        if (data.skills_count) document.getElementById('skill-count').textContent = data.skills_count;
      } catch (e) {
        document.getElementById('gateway-status').textContent = 'Unreachable';
        document.getElementById('overall-status').innerHTML = '<span class="status-dot red"></span>Gateway unreachable';
        document.getElementById('svc-gateway').innerHTML = '<span class="status-dot red"></span>Down';
      }
      // Dashboard is served by nginx, so if we loaded this page, it's up
      document.getElementById('svc-dashboard').innerHTML = '<span class="status-dot green"></span>Running';
    }

    checkHealth();
    setInterval(checkHealth, 10000);
    document.getElementById('refresh-meta').textContent = 'Last checked: ' + new Date().toLocaleTimeString() + ' • Refreshes every 10s';
  </script>
</body>
</html>
